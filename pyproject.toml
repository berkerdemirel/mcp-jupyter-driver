[project]
name = "mcp-jupyter-driver"
version = "0.1.0"
description = "MCP server that lets Claude drive Jupyter notebooks with a persistent kernel, while the user watches updates live in their editor."
readme = "README.md"
authors = [
    { name = "berkerdemirel", email = "berkerdemirel@sabanciuniv.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter-client>=8",
    "mcp[cli]>=1.27.1",
    "nbformat>=5",
    "pydantic>=2",
]

[project.scripts]
mcp-jupyter-driver = "mcp_jupyter_driver.__main__:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
